name: omni_mobile
description: Omni AI Agent - Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  web_socket_channel: ^2.4.0
  http: ^1.1.2
  dio: ^5.4.0

  # Audio
  record: ^5.1.0
  audioplayers: ^5.2.1
  permission_handler: ^11.1.0

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Notifications
  flutter_local_notifications: ^17.0.0
  firebase_messaging: ^27.0.8
  firebase_core: ^2.24.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_markdown: ^0.6.18
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.2.2
  intl: ^0.19.0
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/icon/

  # The Roboto font family is built into Flutter; ship the TTFs here only if you
  # want a custom cut, then uncomment the block below.
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Medium.ttf
  #         weight: 500
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700

# App icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#05091A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
