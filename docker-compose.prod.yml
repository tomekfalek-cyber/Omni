version: '3.8'

services:
  gateway:
    image: yourusername/omni-agent:latest
    container_name: omni-gateway
    restart: unless-stopped
    ports:
      - "7800:7800"
    environment:
      - NODE_ENV=production
      - OMNI_GATEWAY_PORT=7800
      - OMNI_GATEWAY_HOST=0.0.0.0
      - OMNI_AUTH_TOKEN=${OMNI_AUTH_TOKEN}
      - OMNI_ENCRYPTION_KEY=${OMNI_ENCRYPTION_KEY}
      - OMNI_LLM_PROVIDER=${OMNI_LLM_PROVIDER}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OMNI_DB_PATH=/data/memory/omni.db
      - OMNI_LOG_LEVEL=info
      - OMNI_TRACING_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - omni-data:/data
      - omni-logs:/app/.omni/logs
      - omni-audit:/app/.omni/audit
      - omni-backups:/app/.omni/backups
      - omni-secrets:/app/.omni/secrets
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7800/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - omni-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  ollama:
    image: ollama/ollama:latest
    container_name: omni-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - omni-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: omni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - omni-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: omni-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - omni-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  prometheus:
    image: prom/prometheus:latest
    container_name: omni-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - omni-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  grafana:
    image: grafana/grafana:latest
    container_name: omni-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
      - jaeger
    networks:
      - omni-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  omni-data:
    driver: local
  omni-logs:
    driver: local
  omni-audit:
    driver: local
  omni-backups:
    driver: local
  omni-secrets:
    driver: local
  ollama-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  omni-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
